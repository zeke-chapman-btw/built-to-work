# Production Blueprint for Built to Work.
#
# Separate from the preview (render.yaml): its own web service, database and file
# disk, real data only, no preview password gate and no sample data.
# Deploys only when the `production` branch moves, which happens only when the
# owner approves a release.
#
# Create once in Render: Blueprints -> New Blueprint Instance -> this repository,
# branch `production`, Blueprint path `render-production.yaml`.
services:
  - type: web
    name: btw-production
    runtime: python
    branch: production
    plan: 0.5c-512mb
    buildCommand: ./build.sh
    # Roles are code-defined and idempotent; applying them keeps staff permissions current.
    preDeployCommand: python manage.py migrate --noinput && python manage.py configure_staff_roles --apply
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /health/
    autoDeployTrigger: commit
    numInstances: 1
    domains:
      - app.builttoworkusa.com
    disk:
      name: btw-production-private-files
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: btw-production-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: btw-production.onrender.com,app.builttoworkusa.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://btw-production.onrender.com,https://app.builttoworkusa.com
      - key: PARTICIPANT_PORTAL_BASE_URL
        value: https://app.builttoworkusa.com
      - key: BTW_PREVIEW_GATE_ENABLED
        value: "false"
      - key: PRIVATE_DOCUMENT_ROOT
        value: /var/data/participant_documents
      - key: PRIVATE_CONSENT_ROOT
        value: /var/data/consent_documents
      - key: PRIVATE_HISTORICAL_ROOT
        value: /var/data/historical_imports
      - key: PRIVATE_ONBOARDING_ROOT
        value: /var/data/customer_onboarding
      - key: PRIVATE_OPERATIONS_ROOT
        value: /var/data/operations_documents
      - key: CANONICAL_HOST
        value: app.builttoworkusa.com
      # Site email uses the sign-in saved in Settings → Connections; until one
      # exists, nothing leaves (messages are kept in memory like test mode).
      - key: EMAIL_BACKEND
        value: apps.messaging.backends.ConnectionsEmailBackend
      # Email/text/Gmail settings (see docs/messaging-setup.md) are added in the
      # Render dashboard when ready, so nothing here prompts for them.
databases:
  - name: btw-production-db
    databaseName: btw_production
    user: btw_production
    plan: 0.5c-1g
