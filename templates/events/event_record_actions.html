<div class="event-badges"><span class="status-pill event-status-{{ event.status }}">{% if event.is_current %}Current{% else %}{{ event.get_status_display }}{% endif %}</span><span class="status-pill event-details-status{% if event.details_finalized_at %} status-finalized{% endif %}">{{ event.details_status }}</span></div>{% if can_view_staffing %}<p class="event-record-coverage"><span>{{ event.confirmed_staff }} confirmed assignment{{ event.confirmed_staff|pluralize }}</span><a data-event-open="{{ event.id }}" href="{% url 'staffing:event' event.id %}">View daily coverage<span class="sr-only"> for {{ event.name }}</span></a></p>{% endif %}
