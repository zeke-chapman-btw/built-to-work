{% load static ticket_ui %}<section class="ps-ticket">
<img class="ps-ticket-image" src="{{ ticket_image_url }}" width="750" height="1334" alt="Your ticket for {{ event.name }}. Ticket number {{ ticket.ticket_number }}.">
<button type="button" class="ps-button" data-save-ticket data-file="{{ ticket_image_url }}" data-filename="btw-ticket-{{ ticket.ticket_number|default:'ticket' }}.png">Save ticket to my phone</button>
<p class="ps-hint">Or press and hold the ticket and choose “Save to Photos.”</p>
</section><script src="{% static 'participants/ticket.js' %}?v=1" defer></script>
