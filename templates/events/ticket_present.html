{% extends "internal/base.html" %}
{% block title %}Event ticket | Built to Work{% endblock %}
{% block content %}
<main class="card" style="max-width:560px;margin:2rem auto;text-align:center"><h1>{{ event.name }}</h1><p>Your event ticket</p><img src="{{ ticket_qr_data }}" alt="Event QR ticket" style="width:min(300px,100%)"><p>Keep this code available for event check-in.</p>{% if already_checked_in %}<p><strong>Check-in is recorded.</strong></p>{% endif %}</main>
{% endblock %}
