{% if page and page.paginator.num_pages > 1 %}<nav class="r17-pagination" aria-label="Report pages">{% if page.has_previous %}<a class="button secondary" href="?{{ pagination_query }}{% if pagination_query %}&amp;{% endif %}page={{ page.previous_page_number }}">Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button secondary" href="?{{ pagination_query }}{% if pagination_query %}&amp;{% endif %}page={{ page.next_page_number }}">Next</a>{% endif %}</nav>{% endif %}
