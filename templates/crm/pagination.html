{% if page.has_other_pages %}<nav class="crm-actions" aria-label="{{ audience }} interaction pages">{% if page.has_previous %}<a href="?{{ query }}&amp;crm_{{ audience }}_page={{ page.previous_page_number }}#{{ anchor }}">Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?{{ query }}&amp;crm_{{ audience }}_page={{ page.next_page_number }}#{{ anchor }}">Next</a>{% endif %}</nav>{% endif %}
