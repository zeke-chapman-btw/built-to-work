{% extends 'accounts/access_base.html' %}{% load static %}{% block access_content %}
<script src="{% static 'accounts/login.js' %}" defer></script>
<form method="post" data-unified-login>{% csrf_token %}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
{% if form.errors %}<div class="errors" role="alert" tabindex="-1" data-login-errors>{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
<button type="submit">Sign in</button></form>
<nav aria-label="Account help"><a href="{{ recovery_url }}">Forgot your password?</a></nav>
{% endblock %}
