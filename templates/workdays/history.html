<section class="card"><h2>Correction and audit history</h2>{% for entry in history %}<article><h3>{{ entry.action }}</h3><p>{{ entry.actor }} · {{ entry.timestamp }} · {{ entry.reason }}</p><details><summary>Previous and recorded values</summary><pre>{{ entry.old_data }}</pre><pre>{{ entry.new_data }}</pre></details></article>{% empty %}<p>No changes recorded.</p>{% endfor %}</section>
