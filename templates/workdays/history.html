<details class="card btw-disclosure"><summary>Record history</summary>{% for entry in history %}<article><h3>{{ entry.action }}</h3><p>{{ entry.actor }} · {{ entry.timestamp }} · {{ entry.reason }}</p><details><summary>Previous and recorded values</summary><pre>{{ entry.old_data }}</pre><pre>{{ entry.new_data }}</pre></details></article>{% empty %}<p>No changes recorded.</p>{% endfor %}</details>
