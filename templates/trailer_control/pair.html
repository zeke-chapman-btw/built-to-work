{% load static %}<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pair BTW display</title><link rel="stylesheet" href="{% static 'trailer_control/display.css' %}"><body><main class="pair"><img src="{% static 'internal/images/built-to-work-linear.svg' %}" alt="Built to Work"><h1>Connect this display</h1><p>Enter the one-time code from an authorized local Administrator. This display receives no staff access.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label>Pairing code <input name="code" autocomplete="off" maxlength="200" required></label><button type="submit">Connect display</button></form></main></body></html>
