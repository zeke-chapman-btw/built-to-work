<div class="dashboard-section-header">
  <div class="dashboard-section-heading">
    <h2 id="{{ section_id }}">{{ heading }}</h2>
    {% if mark_read %}<button type="button" disabled title="Unavailable: no updates feed is connected">Mark All as Read<span class="dashboard-sr-only"> (unavailable)</span></button>{% endif %}
    {% if view_more %}<button type="button" disabled title="Unavailable: additional analytics are not connected">View More<span class="dashboard-sr-only"> (unavailable)</span></button>{% endif %}
  </div>
  {% if edit_url %}<a class="dashboard-edit" href="{{ edit_url }}">Edit</a>{% else %}<button class="dashboard-edit" type="button" disabled title="Customization is not available in Phase 1">Edit<span class="dashboard-sr-only"> (preview only)</span></button>{% endif %}
</div>
