<div class="field btw-field field-{{ field.name }}{% if field.errors %} btw-field-invalid{% endif %}{% if field.field.widget.input_type == 'checkbox' and not is_group %} btw-field-checkbox{% endif %}">
{% if is_group %}<span class="btw-field-label" id="{{ field_id }}_label">{{ field.label }}</span>{{ widget }}{% elif field.field.widget.input_type == 'checkbox' %}{{ widget }}<label for="{{ field_id }}">{{ field.label }}</label>{% else %}<label for="{{ field_id }}">{{ field.label }}{% if field.field.required %}<span class="btw-required" aria-hidden="true"> *</span>{% endif %}</label>{{ widget }}{% endif %}
{% if field.help_text %}<small id="{{ field_id }}_help">{{ field.help_text|safe }}</small>{% endif %}{% if field.errors %}<div id="{{ field_id }}_errors">{{ field.errors }}</div>{% endif %}</div>
