<article class="card btw-record-row {{ record_class }}">
<a class="btw-record-primary" href="{{ record_url }}" aria-labelledby="record-title-{{ record_id }}"{% if event_record %} data-event-open="{{ record_id }}"{% endif %}><h3 id="record-title-{{ record_id }}">{{ record_title }}</h3>{% if primary_template %}{% include primary_template %}{% endif %}</a>
{% if secondary_template %}<div class="btw-record-secondary">{% include secondary_template %}</div>{% endif %}</article>
