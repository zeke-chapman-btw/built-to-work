<nav class="btw-section-navigation ops-resource-navigation" aria-label="Operations sections">{% for tab in primary_tabs %}<a class="ops-resource-tab" href="{{ tab.url }}"{% if tab.active %} aria-current="page"{% endif %}>{{ tab.label }}</a>{% endfor %}{% if groups %}<details class="ops-resource-more" data-ui-menu><summary{% if more_active %} class="is-active"{% endif %}>More <span aria-hidden="true">⌄</span></summary><div class="ops-resource-menu">{% for group in groups %}<span class="ops-resource-menu-label">{{ group.title }}</span>{% for link in group.links %}<a href="{{ link.url }}"{% if link.active %} aria-current="page"{% endif %}>{{ link.label }}</a>{% endfor %}{% endfor %}</div></details>{% endif %}</nav>
