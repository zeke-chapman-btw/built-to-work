<div class="btw-workspace-navigation"><nav class="btw-section-navigation ops-resource-navigation btw-workspace-nav" aria-label="Operations sections">{% for tab in primary_tabs %}<a class="ops-resource-tab" href="{{ tab.url }}"{% if tab.active %} aria-current="page"{% endif %}>{{ tab.label }}</a>{% endfor %}</nav>{% if groups %}<details class="ops-resource-more btw-workspace-menu" data-ui-menu><summary aria-label="More Operations sections"{% if more_active %} class="is-active"{% endif %}>More</summary><div class="ops-resource-menu">{% for group in groups %}<span class="ops-resource-menu-label">{{ group.title }}</span>{% for link in group.links %}<a href="{{ link.url }}"{% if link.active %} aria-current="page"{% endif %}>{{ link.label }}{% if link.context_label %}<small>{{ link.context_label }}</small>{% endif %}</a>{% endfor %}{% endfor %}</div></details>{% endif %}</div>
