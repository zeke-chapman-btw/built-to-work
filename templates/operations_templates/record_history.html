<details class="btw-disclosure p2-record-details"><summary>History<span class="visually-hidden"> for {{ template.name }}</span></summary><nav aria-label="Revisions of {{ template.name }}">{% for revision in template.revisions.all %}<p><a href="{% url 'operations:template-detail' revision.pk %}?from={{ request.get_full_path|urlencode }}">Revision {{ revision.number }} · {{ revision.get_status_display }}</a></p>{% endfor %}</nav></details>
