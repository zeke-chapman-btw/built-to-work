{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Built to Work Registration{% endblock %}</title><link rel="stylesheet" href="{% static 'kiosk/css/kiosk.css' %}"><style>
body{margin:0;background:#f7f7f7;color:#111;font-family:Roboto,Arial,sans-serif}.reg-shell{max-width:760px;margin:auto;min-height:100vh;background:#fff}.reg-header{background:#050505;padding:22px 28px;border-bottom:5px solid #d71936}.reg-header img{width:250px;max-width:80%;filter:brightness(0) invert(1)}.reg-main{padding:28px 22px 48px}.eyebrow{color:#d71936;font-weight:800;letter-spacing:.08em}.hero{font-family:'Futura Condensed PT',Arial,sans-serif;font-size:clamp(2.2rem,8vw,4rem);line-height:.95;margin:.25rem 0 1rem;text-transform:uppercase}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:22px;box-shadow:0 8px 24px #00000010}.field{margin:0 0 18px}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;border:2px solid #bbb;border-radius:10px;padding:13px;font:inherit;background:#fff}.field textarea{min-height:90px}.errors{color:#a80d25;font-weight:700;margin:.35rem 0}.actions{display:flex;gap:12px;justify-content:space-between;margin-top:26px}.button{display:inline-block;border:0;border-radius:10px;padding:14px 22px;background:#d71936;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.button.secondary{background:#111}.muted{color:#555}.progress{height:8px;background:#eee;border-radius:8px;margin:18px 0 28px}.progress span{display:block;height:100%;width:50%;background:#d71936;border-radius:8px}@media(max-width:520px){.reg-header{padding:16px 18px}.reg-main{padding:22px 16px}.card{padding:17px}.actions{flex-direction:column-reverse}.button{text-align:center}}
</style></head><body><div class="reg-shell"><header class="reg-header"><img src="{% static 'kiosk/images/built-to-work-linear.svg' %}" alt="Built to Work"></header>{% block content %}{% endblock %}</div></body></html>
