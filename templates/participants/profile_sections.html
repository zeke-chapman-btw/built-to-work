{% if section != 'overview' %}

<nav class="btw-section-navigation people-profile-sections" aria-label="Participant profile sections"><div class="btw-section-links people-profile-tabs">{% for item in primary_items %}<a href="{{ item.url }}"{% if item.active %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}{% if more_items %}<details data-ui-menu class="people-profile-more"><summary{% if more_active %} aria-current="page"{% endif %}>{{ more_active|default:'More' }}</summary><div>{% for item in more_items %}<a href="{{ item.url }}"{% if item.active %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}</div></details>{% endif %}</div><details class="btw-section-picker people-profile-picker" data-ui-menu><summary>{{ active_label }}</summary><div>{% for item in items %}<a href="{{ item.url }}"{% if item.active %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}</div></details></nav>

{% endif %}
