{% load ui_patterns %}<div class="btw-editor-grid">{% for field in form.visible_fields %}<div class="{% if field.name in 'preferred_work_type current_employment_status employment_classification trades trades_other' %}btw-editor-wide{% endif %}">{% ui_field field %}{% if field.name == 'trades' and form.trade_options_url and user.is_superuser %}<p class="event-help"><a href="{{ form.trade_options_url }}" target="_blank" rel="noopener">Change the trade list</a></p>{% endif %}</div>{% endfor %}</div>
