{% if rows.paginator.num_pages > 1 %}<nav class="customer-pagination" aria-label="Pagination">{% if rows.has_previous %}<a href="?{{ rows.query_prefix }}page={{ rows.previous_page_number }}">← Previous</a>{% endif %}<span>Page {{ rows.number }} of {{ rows.paginator.num_pages }}</span>{% if rows.has_next %}<a href="?{{ rows.query_prefix }}page={{ rows.next_page_number }}">Next →</a>{% endif %}</nav>{% endif %}
