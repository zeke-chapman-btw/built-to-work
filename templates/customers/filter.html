<form method="get" class="customer-filters" role="search"><input type="hidden" name="return_to" value="{{ back_url }}"><div><label for="q">Search {{ active_tab|default:'Campaigns' }}</label><input id="q" name="q" value="{{ q }}"></div>{% if statuses %}<div><label for="status">Status</label><select id="status" name="status"><option value="">All statuses</option>{% for key,label in statuses %}<option value="{{ key }}" {% if status == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>{% endif %}<button class="customer-button">Apply</button></form>
