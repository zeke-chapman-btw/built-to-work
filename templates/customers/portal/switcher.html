<form method="post" action="{% url 'customer_portal:switch' %}" class="company-switch">{% csrf_token %}<label for="company-choice">Company</label><select name="organization" id="company-choice">{% for item in companies %}<option value="{{ item.id }}" {% if item.id == company.id|stringformat:'s' %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select><button>Switch</button></form>
