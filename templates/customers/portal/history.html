{% for item in recent %}<article class="row">{% if item.url %}<a href="{{ item.url }}"><strong>{{ item.subject }}</strong><span>{{ item.label }}</span></a>{% else %}<strong>{{ item.label }}</strong>{% endif %}<time class="help" datetime="{{ item.at|date:'c' }}">{{ item.at|date:'M j, Y · g:i A T' }}</time></article>{% empty %}<p class="muted">No recent workflow or company interaction activity.</p>{% endfor %}
