<nav class="cp3-chips" aria-label="Filter by status"><a class="cp3-fchip{% if not status %} is-on{% endif %}" href="?{% if q %}q={{ q|urlencode }}&amp;{% endif %}return_to={{ back_url|urlencode }}">All</a>{% for key,label in statuses %}<a class="cp3-fchip{% if status == key %} is-on{% endif %}" href="?status={{ key }}{% if q %}&amp;q={{ q|urlencode }}{% endif %}&amp;return_to={{ back_url|urlencode }}">{{ label }}</a>{% endfor %}</nav>
