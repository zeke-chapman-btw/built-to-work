<section class="card"><h2>Review for a position</h2><form method="post">{% csrf_token %}<input type="hidden" name="operation" value="review_selection"><label>Authorized recruiting opportunity <select name="opportunity_id" required><option value="">Choose a position</option>{% for opportunity in available_opportunities %}<option value="{{ opportunity.pk }}">{{ opportunity.need.title }} · {{ opportunity.need.organization }}</option>{% endfor %}</select></label><button class="button button-primary">Review matching, conflicts &amp; selection</button></form><p>Selection remains a staff decision. It does not grant employer access.</p></section>
