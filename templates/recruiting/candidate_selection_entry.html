<section class="card ops-list-card"><header class="ops-list-head"><h2>Put forward for a position</h2></header><form method="post" class="rc-form rc-stage-form">{% csrf_token %}<input type="hidden" name="operation" value="review_selection"><div class="field"><label for="select-opportunity">Position</label><select id="select-opportunity" name="opportunity_id" required><option value="">Choose a position</option>{% for opportunity in available_opportunities %}<option value="{{ opportunity.pk }}">{{ opportunity.need.title }} · {{ opportunity.need.organization }}</option>{% endfor %}</select></div><button class="button button-primary" type="submit">Review match</button></form></section>
