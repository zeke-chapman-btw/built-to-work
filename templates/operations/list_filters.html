<form method="get" class="ops-filter-grid" role="search">{% if resource_filter %}<input type="hidden" name="resource" value="{{ resource_filter }}">{% endif %}{% if execution_view %}<div class="field"><label for="ops-view">Events</label><select id="ops-view" name="view"><option value="active"{% if execution_view == "active" %} selected{% endif %}>Operational events</option><option value="all"{% if execution_view == "all" %} selected{% endif %}>All events</option><option value="attention"{% if execution_view == "attention" %} selected{% endif %}>Past scheduled end · action available</option></select></div>{% endif %}<div class="field"><label for="ops-search">Search</label><input type="search" id="ops-search" name="q" value="{{ q }}" placeholder="{{ search_placeholder|default:'Name or description' }}"></div>{% if status_choices %}<div class="field"><label for="ops-status">Status</label><select id="ops-status" name="status"><option value="">All statuses</option>{% for value,label in status_choices %}<option value="{{ value }}"{% if selected_status == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>{% endif %}<div class="field"><label for="ops-sort">Sort</label><select id="ops-sort" name="sort"><option value="default">Default order</option><option value="name"{% if selected_sort == 'name' %} selected{% endif %}>Name</option><option value="newest"{% if selected_sort == 'newest' %} selected{% endif %}>Newest</option></select></div><button class="button secondary">Apply filters</button><a href="{{ filter_clear_url|default:request.path }}">Clear</a></form>
