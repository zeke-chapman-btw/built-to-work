<div class="ops-progress-grid" aria-label="Checklist progress">{% for indicator in indicators %}<article class="ops-progress-tile"><span>{{ indicator.label }}</span>{% if indicator.total %}<strong>{{ indicator.completed }} <small>of {{ indicator.total }} done</small></strong><progress max="{{ indicator.total }}" value="{{ indicator.completed }}" aria-label="{{ indicator.label }}: {{ indicator.completed }} of {{ indicator.total }} done">{{ indicator.percent }}%</progress>{% if indicator.na %}<small>{{ indicator.na }} not needed</small>{% endif %}{% else %}<strong>—</strong><small>Nothing to do</small>{% endif %}</article>{% endfor %}</div>
