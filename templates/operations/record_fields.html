<section class="task-linked-records task-field-wide" aria-labelledby="task-linked-records-title"><h3 id="task-linked-records-title">Linked records</h3><div class="task-quick-grid">{% for field in form %}{% if field.name == 'participants' or field.name == 'customers' or field.name == 'events' %}<div class="task-quick-field"><label for="query-{{ field.name }}">Find {{ field.label|lower }}</label><input type="search" id="query-{{ field.name }}" data-record-query="{{ field.name }}" aria-controls="{{ field.auto_id }}" autocomplete="off"><p class="task-record-status" role="status"></p>{{ field.label_tag }}{{ field }}{{ field.errors }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}</div>{% endif %}{% endfor %}</div></section>
