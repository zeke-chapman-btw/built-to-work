{% if form.date_shortcuts %}<div class="date-shortcuts" role="group" aria-label="Due-date shortcuts">{% for label,date in form.date_shortcuts %}<button type="button" data-due-date="{{ date|date:'Y-m-d' }}" data-date-label="{{ date|date:'M j, Y' }}">{{ label }} <span>{{ date|date:'M j, Y' }}</span></button>{% endfor %}</div><p class="date-shortcut-scope">{{ form.date_timezone }} calendar dates · Next Week = following Monday · Business Day = weekdays, no holiday calendar.</p><p class="date-shortcut-scope" role="status" data-date-choice-status></p>{% endif %}
