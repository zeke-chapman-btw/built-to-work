{% if rows.has_other_pages %}<nav class="event-record-actions" aria-label="List pages">{% if rows.has_previous %}<a href="?q={{ q|urlencode }}&amp;status={{ selected_status|urlencode }}&amp;sort={{ selected_sort|urlencode }}&amp;page={{ rows.previous_page_number }}">Previous</a>{% endif %}<span>Page {{ rows.number }} of {{ rows.paginator.num_pages }}</span>{% if rows.has_next %}<a href="?q={{ q|urlencode }}&amp;status={{ selected_status|urlencode }}&amp;sort={{ selected_sort|urlencode }}&amp;page={{ rows.next_page_number }}">Next</a>{% endif %}</nav>{% endif %}
