<section class="card op2-card"><header class="op2-head"><h2>Ticket messages</h2></header>{% for item in items %}<div class="cp3-row cp3-x" style="--cols:90px minmax(0,1fr) auto"><strong>{{ item.channel }}</strong><span class="cp3-note">{{ item.when|date:'M j, Y · g:i A' }}{% if item.note %} · {{ item.note }}{% endif %}</span><span class="cp3-chip {{ item.tone }}">{{ item.label }}</span></div>{% empty %}<p class="cp3-empty">No ticket emails or texts for this registration.</p>{% endfor %}</section>
