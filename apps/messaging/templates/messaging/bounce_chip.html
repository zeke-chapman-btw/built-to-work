{% if bounce %}<div class="pv-bounce" style="margin-top:4px"><span class="cp3-chip r" title="{{ bounce.reason }}">Email bounced {{ bounce.bounced_at|date:'M j' }}</span>{% if can_edit %} <form method="post" action="{% url 'messaging:bounce-clear' participant.pk %}" style="display:inline">{% csrf_token %}<button class="pv-linkbtn" type="submit" style="background:none;border:0;padding:0;color:#ac1929;font-size:12px;text-decoration:underline;cursor:pointer">Address is fixed, send again</button></form>{% endif %}<small style="display:block;color:#71717a;font-size:12px;margin-top:2px">Automatic emails to this address are paused. Check the address or update it.</small></div>{% endif %}
