{% if show %}<section class="cp3-card" id="texts" style="margin-top:16px"><header class="cp3-head"><h2>Text replies</h2>{% if count %}<span class="cp3-chip y">{{ count }} new</span>{% else %}<span class="cp3-chip">None new</span>{% endif %}</header>
<div class="cp3-row cp3-x" style="--cols:minmax(0,1fr) auto"><span><strong>{% if count %}{{ count }} {{ count|pluralize:"person has,people have" }} texted you back{% else %}No new texts for you{% endif %}</strong><small>When you text someone from the app, their replies come here.</small></span><a class="button secondary" href="{% url 'messaging:texts' %}">Open</a></div></section>{% endif %}
