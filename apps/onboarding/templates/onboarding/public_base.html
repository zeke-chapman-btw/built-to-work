<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer onboarding · Built to Work</title><meta name="robots" content="noindex">
<style>body{margin:0;background:#f4f4f5;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#18181b}main{max-width:880px;margin:0 auto;padding:24px 16px 48px}.brand{font-weight:800;letter-spacing:.02em;font-size:20px;margin:6px 0 4px}.brand span{color:#d0212f}.lead{color:#52525b;margin:0 0 18px}
input[type=text],input[type=email],input[type=url],input[type=number],input[type=date],select,textarea{font:inherit;padding:9px 11px;border:1px solid #d4d4d8;border-radius:8px;background:#fff}textarea{resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid #fca5a5;border-color:#d0212f}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 18px;border-radius:10px;border:1px solid #d4d4d8;background:#fff;color:#18181b;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}.button-primary{background:#d0212f;border-color:#d0212f;color:#fff}
.errorlist{list-style:none;margin:4px 0 0;padding:0;color:#b91c1c;font-size:13px}.btw-field-invalid input,.btw-field-invalid textarea{border-color:#b91c1c}
.messages{list-style:none;padding:0}</style></head><body><main><div class="brand">BUILT <span>TO</span> WORK</div><p class="lead">Customer onboarding. Your answers are saved after each step, so you can come back to this link any time.</p>
{% if messages %}<ul class="messages">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>{% endif %}
{% block workspace_content %}{% endblock %}<p style="margin-top:24px;font-size:13px;color:#71717a"><a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a></p></main></body></html>
