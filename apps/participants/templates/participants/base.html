<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Built to Work Participants{% endblock %}</title><style>body{font:16px system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#18202a}label{display:block;margin-top:1rem;font-weight:600}input{padding:.6rem;max-width:100%;box-sizing:border-box}button{margin-top:1rem;padding:.65rem 1rem}nav{display:flex;gap:1rem;border-bottom:1px solid #ddd;padding-bottom:1rem}li{margin:.3rem 0}.errorlist{color:#a00}</style></head><body><nav><a href="{% url 'participants:account-request' %}">Request account</a><a href="{% url 'participants:login' %}">Sign in</a>{% if user.is_authenticated %}<a href="{% url 'participants:profile' %}">My profile</a><form method="post" action="{% url 'participants:logout' %}" style="display:inline">{% csrf_token %}<button>Sign out</button></form>{% endif %}</nav><main>{% if messages %}{% for message in messages %}<p>{{ message }}</p>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></body></html>
